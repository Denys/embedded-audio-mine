schema_version: 1
last_updated: 2026-08-31

shared:
  anti_repeat_window_days: 30
  questionnaire_enabled: true
  questionnaire_max_questions: 8
  rule_change_policy: apply only explicit feedback; record regression risk and next-run test

daily:
  active_focus: standalone_open_hardware
  hard_gates:
    - schematic_present
    - editable_pcb_or_verified_fabrication_files
    - bom_or_sufficient_part_value_evidence
    - explicit_hardware_license_permits_modification_and_redistribution
    - firmware_source_and_build_path_when_firmware_is_part_of_device
    - standalone_device_not_eurorack_or_generic_carrier
  boosts:
    - physical_controls
    - integrated_audio_midi
    - panel_enclosure_mechanical_files
    - mixed_signal_audio_value
    - independent_low_seo_source
  hard_exclusions:
    - official_mutable_instruments_as_new_discovery
    - noncommercial_hardware_license_for_ranked_lane
    - eurorack_only_for_ranked_standalone_lane
    - photo_only_or_store_page_only_hardware
    - generic_dev_shield_or_bare_codec_board
  recheck_queue:
    - project: plinkysynth/plinky_public
      status: provisional_lead
      blocker: fresh anti-repeat/current-state verification before ranking
    - project: MicroDexed Touch
      status: hold
      blocker: verify raw hardware files and hardware-license scope
    - project: Ixox/preenfm3
      status: hold
      blocker: verify explicit hardware license and hardware artifact completeness
    - project: Groovesizer_RED
      status: hold
      blocker: verify open hardware artifacts, license, and complete device path
    - project: MeeBlip family
      status: hold
      blocker: choose exact version; verify complete hardware source and license
  bonus_only:
    - project: wntrblm/Castor_and_Pollux
      reason: Eurorack dependency
    - project: wntrblm/Big_Honking_Button
      reason: Eurorack dependency
  note: all candidates are research state only; none are publication evidence until canonical trackers/digests say so

weekly_analog:
  active_focus: open_source_analog_and_mixed_signal_audio_hardware
  preserve_scope:
    - eurorack_allowed
    - standalone_allowed
    - reusable_subassemblies_allowed
    - manufacturer_reference_designs_allowed_as_foundation_updates
  recheck_queue:
    - project: ThomHPL/Open80017a
      status: ref_pass
      blocker: verify a built v0.2 release, Gerbers, PMOS lifecycle substitution, and quantitative A/B results
    - project: barnabywalters/Schraeg
      status: pass_with_erratum
      blocker: locate or validate an attenuverter-range fix and measured resonance-CV/FM behavior
    - project: orange-dot/mamut-epm-hw-
      status: hold
      blocker: wait for a fabricated audio PCB, bench evidence, and measurements
    - project: UNH µModules
      status: hold
      blocker: locate editable EDA, fabrication files, and an explicit hardware-source license separate from the thesis license
  note: daily standalone gates do not narrow the weekly analog mine

feedback:
  last_answers: {}
  pending_rule_changes: []
  next_run_search_debt:
    - "daily: verify recheck queue against current primary artifacts and both publication streams"
    - "daily: expand Codeberg/GitLab/SourceHut/Hackaday/forum lanes before ranking"
    - "weekly analog: continue hidden-gems registry revalidation under weekly_deep profile"
    - "weekly analog: find a fabricated SSI2100 plus SSI2162 compandor with editable PCB source and measured tracking"
    - "weekly analog: search non-GitHub digitally assisted analog calibration, DAC trims, autotune fixtures, and per-voice NVM"
    - "weekly analog: recheck Open80017a v0.2, Schraeg attenuverter fixes, and ZVP1320F or V2164 lifecycle substitutes"
