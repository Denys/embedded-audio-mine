schema_version: 1
last_updated: 2026-10-23

shared:
  anti_repeat_window_days: 30
  questionnaire_enabled: true
  questionnaire_max_questions: 8
  rule_change_policy: apply only explicit feedback; record regression risk and next-run test

daily:
  active_focus: standalone_open_hardware
  hard_gates:
    - schematic_present
    - editable_pcb_or_verified_fabrication_files
    - bom_or_sufficient_part_value_evidence
    - explicit_hardware_license_permits_modification_and_redistribution
    - firmware_source_and_build_path_when_firmware_is_part_of_device
    - standalone_device_not_eurorack_or_generic_carrier
  boosts:
    - physical_controls
    - integrated_audio_midi
    - panel_enclosure_mechanical_files
    - mixed_signal_audio_value
    - independent_low_seo_source
  hard_exclusions:
    - official_mutable_instruments_as_new_discovery
    - noncommercial_hardware_license_for_ranked_lane
    - eurorack_only_for_ranked_standalone_lane
    - photo_only_or_store_page_only_hardware
    - generic_dev_shield_or_bare_codec_board
  recheck_queue:
    - project: amesser-group/modular-fx
      status: hold
      blocker: wait for completed prototype testing BOM Gerbers consolidated license files and quantitative audio measurements
    - project: vitoria-b/little-angel-chorus
      status: hold
      blocker: verify an explicit reusable hardware license and BBD design lineage
    - project: FAREKIND/VCO-SSI2131
      status: hold
      blocker: publish the actual circuit and PCB source rather than panel files and photographs only
    - project: plinkysynth/plinky_public
      status: provisional_lead
      blocker: fresh anti-repeat/current-state verification before ranking
    - project: MicroDexed Touch
      status: hold
      blocker: verify raw hardware files and hardware-license scope
    - project: Ixox/preenfm3
      status: hold
      blocker: verify explicit hardware license and hardware artifact completeness
    - project: Groovesizer_RED
      status: hold
      blocker: verify open hardware artifacts, license, and complete device path
    - project: MeeBlip family
      status: hold
      blocker: choose exact version; verify complete hardware source and license
  bonus_only:
    - project: wntrblm/Castor_and_Pollux
      reason: Eurorack dependency
    - project: wntrblm/Big_Honking_Button
      reason: Eurorack dependency
  note: all candidates are research state only; none are publication evidence until canonical trackers/digests say so

codex_weekly:
  latest_digest_date: 2026-10-20
  source_review_completed: 2026-10-20
  explicit_questionnaire_answers: {}
  next_run_rule_change:
    date: 2026-10-20
    stream: codex_weekly
    status: proposed_not_implemented
    change: integrate bare SSI queries, pinned file reads, meaningful-repeat checks and token-boundary BOM qualification
    failure_mode_fixed: panel-only assets, dummy PCB files, control-only editors, copied cores and metadata-only repeats require source-level review
    expected_improvement: source-grounded rankings without weakening strict rotation or cross-stream checks
    regression_risk: losing useful incomplete hardware references or distinct integration value
    test_case: populated circuit source versus dummy PCB; audio renderer versus MIDI editor; substantive phase generator delta versus GUI noexcept change
    acceptance_criteria: all six SSI families researched; pinned source review for every ranked entry; existing repeat rules retained; no inferred target tests
    keep_or_remove_decision: validate before changing persistent runner rules
  next_run_search_debt:
    - expand SSI2190 mixer and filter-bank circuit leads beyond GitHub repository metadata
    - recheck aesuf only after circuit annotations and PCB completion
    - recheck FAREKIND only after circuit sources accompany the panel assets
  recheck_evidence_2026_10_20:
    - project: spandit69/nest-audio-pcb
      status: hold
      blocker: placeholder schematic contains no circuit; wait for populated circuit and routed PCB
    - project: mitchwright/SSI2144
      status: hold
      blocker: KiCad PCB is an empty 51-byte file; wait for populated implementation
    - project: reneweller-coding/Totality
